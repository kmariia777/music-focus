kind = "web"
previewPath = "/"
title = "Focus Music Hub"
version = "1.0.0"
id = "artifacts/focus-music-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22173

[services.development]
run = "pnpm --filter @workspace/focus-music-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focus-music-hub", "run", "build" ]
publicDir = "artifacts/focus-music-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22173"
BASE_PATH = "/"
